<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Blog{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    {% load static %} 

    <style>
.navbar {
    border-bottom: 2px solid rgba(255,255,255,0.1);
}

form input {
    height: 42px;
}

.btn {
    height: 42px;
    display: flex;
    align-items: center;
}



/* ===== Light mode default ===== */


body {
    background: url("{% static 'images/image.png' %}");
    background-size: cover;
    background-position: center;
    
}






/* ===== Full dark mode ===== */
.dark-mode {
    background-color: #0d1117 !important;  /* GitHub dark bg */
    color: #e6edf3 !important;
}

/* All container text white */
.dark-mode * {
    color: #e6edf3 !important;
}

/* Navbar dark */
.dark-mode .navbar {
    background-color: #0c0f13 !important;
}

/* Cards dark */
.dark-mode .card {
    background-color: #161b22 !important;
    border: 1px solid #30363d !important;
}

/* Links */
.dark-mode a {
    color: #58a6ff !important;
}

/* Inputs */
.dark-mode input,
.dark-mode textarea {
    background-color: #0d1117 !important;
    border: 1px solid #30363d !important;
    color: #e6edf3 !important;
}

/* Buttons */
.dark-mode .btn-primary {
    background-color: #238636 !important;
    border-color: #238636 !important;
}





</style>




</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm px-4">
    <div class="container-fluid d-flex align-items-center">

        <!-- Brand -->
        <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}">
            My Blog
        </a>
        <button id="darkToggle" class="btn btn-outline-light ms-3">🌙 Dark Mode</button>


        <!-- SEARCH BAR (center) -->
        <form method="GET" action="{% url 'home' %}" 
              class="d-flex mx-auto" style="width: 420px;">

            <input 
                class="form-control me-2 rounded-pill px-3"
                type="search"
                name="q"
                placeholder="Search posts..."
                value="{{ request.GET.q }}"
            >
            
            <button class="btn btn-primary rounded-pill px-4" type="submit">
                Search
            </button>
        </form>

        <!-- Create Post button -->
        <a class="btn btn-success rounded-pill px-4" href="{% url 'create-post' %}">
            Create Post
        </a>

    </div>
</nav>


    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>



    <script>
const toggleBtn = document.getElementById("darkToggle");

toggleBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        toggleBtn.textContent = "☀️ Light Mode";
    } else {
        toggleBtn.textContent = "🌙 Dark Mode";
    }
});
</script>



</body>

<!-- ---------- FOOTER SECTION ---------- -->
<footer style="
    width: 100%;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    padding: 25px 0;
    text-align: center;
    margin-top: 50px;
    backdrop-filter: blur(8px);
">
    <h4 style="margin: 0; font-weight: 600;">My Blog</h4>
    <p style="margin: 5px 0 0; font-size: 0.9rem; opacity: 0.8;">
        © {{ now|date:"Y" }} All Rights Reserved | Designed by Maheswari
    </p>
</footer>
<!-- ---------- END FOOTER ---------- -->




</html>
