{% extends 'base.html' %}
{% block title %}Create/Edit Post{% endblock %}
{% block content %}

<div class="card p-4 shadow">
    <h2>{% if post %}Edit{% else %}Create{% endif %} Post</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success" type="submit">{% if post %}Update{% else %}Create{% endif %}</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
